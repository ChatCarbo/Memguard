[package]
name = "memguard"
version = "2.0.0"
edition = "2021"
authors = ["ChatCarbo"]
description = "Moniteur et optimiseur de mémoire RAM Windows 11, ultra-léger"
build = "build.rs"

[dependencies]
# GUI légère : rendu OpenGL (glow), pas de wgpu, pas de tokio
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
# Icône de zone de notification (menu : Afficher / Optimiser / Quitter)
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Manifeste "requireAdministrator" (nécessaire pour purger la Standby List)
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
